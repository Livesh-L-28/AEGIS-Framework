[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-ai"
version = "0.1.0"
description = "Open-source autonomous reliability engineering framework for AI-powered incident investigation, reasoning, remediation, and reliability automation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "AEGIS Framework Contributors" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "sre",
    "reliability",
    "ai-agents",
    "incident-response",
    "root-cause-analysis",
    "observability",
    "autonomy",
    "kubernetes",
    "prometheus",
    "opentelemetry",
    "loki",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "llmfirewall-core>=1.0.0",
    "aireliability>=0.1.0",
]

[project.optional-dependencies]
observability = [
    "httpx>=0.27.0",
]
kubernetes = []
github = []
all = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "build>=1.2.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://github.com/Livesh-L-28/AEGIS-Framework"
Documentation = "https://github.com/Livesh-L-28/AEGIS-Framework#readme"
Repository = "https://github.com/Livesh-L-28/AEGIS-Framework.git"
Issues = "https://github.com/Livesh-L-28/AEGIS-Framework/issues"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests requiring real local infrastructure services",
]
addopts = "-m 'not integration'"
